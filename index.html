<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060b" />
    <title>Web Profil XI RPL Kelompok 8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #05060b;
        --panel: rgba(10, 15, 28, 0.58);
        --line: rgba(0, 243, 255, 0.22);
        --cyan: #00f3ff;
        --purple: #7928ca;
        --magenta: #ff35c9;
        --muted: #95a3bb;
        --white: #f3f8ff;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--white);
        background: var(--ink);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }

      .page {
        position: relative;
        min-height: 100vh;
        isolation: isolate;
        background: radial-gradient(circle at 13% 18%, rgba(121, 40, 202, 0.2), transparent 27rem), radial-gradient(circle at 86% 72%, rgba(0, 243, 255, 0.1), transparent 26rem), #05060b;
      }

      #space {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
      }
      .grid-floor {
        position: fixed;
        z-index: -1;
        left: -10%;
        right: -10%;
        bottom: -17vh;
        height: 48vh;
        opacity: 0.2;
        transform: perspective(500px) rotateX(65deg);
        transform-origin: bottom;
        background-image: linear-gradient(rgba(0, 243, 255, 0.25) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.25) 1px, transparent 1px);
        background-size: 68px 68px;
        mask-image: linear-gradient(to top, black, transparent 78%);
      }

      .shell {
        width: min(1160px, calc(100% - 48px));
        margin: 0 auto;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 76px;
        margin-top: 16px;
        padding: 0 12px 0 18px;
        border: 1px solid rgba(0, 243, 255, 0.16);
        border-radius: 9px;
        background: rgba(5, 8, 18, 0.64);
        box-shadow:
          0 16px 50px rgba(0, 0, 0, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
      }
      .nav::after {
        position: absolute;
        right: 26px;
        bottom: -1px;
        left: 26px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
        box-shadow: 0 0 12px var(--cyan);
        content: "";
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--white);
        text-decoration: none;
        font:
          700 0.87rem "Orbitron",
          sans-serif;
        letter-spacing: 0.12em;
      }
      .brand-mark {
        width: 27px;
        height: 27px;
        position: relative;
        border: 2px solid var(--cyan);
        transform: rotate(45deg);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.75);
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 5px;
        border: 1px solid var(--magenta);
      }
      .menu {
        display: flex;
        gap: 4px;
        margin-right: auto;
        margin-left: auto;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.035);
      }
      .menu a {
        position: relative;
        padding: 8px 13px;
        border-radius: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        text-decoration: none;
        transition:
          color 0.25s,
          text-shadow 0.25s,
          background 0.25s;
      }
      .menu a:hover {
        color: var(--cyan);
        background: rgba(0, 243, 255, 0.08);
        text-shadow: 0 0 12px var(--cyan);
      }
      .menu a:first-child {
        color: var(--white);
        background: rgba(0, 243, 255, 0.1);
      }
      .menu a:first-child::after {
        position: absolute;
        right: 13px;
        bottom: 3px;
        left: 13px;
        height: 1px;
        background: var(--cyan);
        box-shadow: 0 0 8px var(--cyan);
        content: "";
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .wallet {
        display: inline-flex;
        align-items: center;
        padding: 11px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 5px;
        color: var(--white);
        background: rgba(255, 255, 255, 0.04);
        font:
          600 0.72rem "Orbitron",
          sans-serif;
        letter-spacing: 0.07em;
        cursor: pointer;
        text-decoration: none;
        transition: 0.25s;
      }
      .wallet:hover {
        border-color: var(--magenta);
        box-shadow: 0 0 20px rgba(255, 53, 201, 0.28);
      }
      .launch,
      .primary {
        border: 1px solid var(--cyan);
        border-radius: 5px;
        color: var(--ink);
        background: var(--cyan);
        font:
          700 0.72rem "Orbitron",
          sans-serif;
        letter-spacing: 0.07em;
        cursor: pointer;
        box-shadow: 0 0 22px rgba(0, 243, 255, 0.28);
        transition: 0.25s;
      }
      .launch {
        display: inline-flex;
        align-items: center;
        padding: 12px 17px;
        text-decoration: none;
      }
      .launch:hover,
      .primary:hover {
        color: var(--white);
        background: transparent;
        box-shadow: 0 0 28px rgba(0, 243, 255, 0.55);
      }

      .hero {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 88px);
        padding: 48px 0 82px;
        text-align: center;
      }
      .hero-content {
        width: 100%;
        max-width: 1100px;
        overflow: visible;
        animation: rise 0.9s ease both;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 13px;
        border: 1px solid rgba(0, 243, 255, 0.4);
        border-radius: 999px;
        color: var(--cyan);
        background: rgba(0, 243, 255, 0.06);
        font:
          600 0.64rem "Orbitron",
          sans-serif;
        letter-spacing: 0.13em;
        box-shadow:
          0 0 22px rgba(0, 243, 255, 0.12) inset,
          0 0 18px rgba(0, 243, 255, 0.14);
        animation: text-rise 0.8s 0.1s ease both;
      }
      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--magenta);
        box-shadow: 0 0 10px var(--magenta);
      }
      h1 {
        width: max-content;
        max-width: none;
        margin: 27px auto 20px;
        padding: 0 4px;
        font:
          800 clamp(2rem, 6.2vw, 5.5rem)/1.1 "Orbitron",
          sans-serif;
        white-space: normal;
        letter-spacing: -0.02em;
        background: linear-gradient(105deg, #fff 8%, var(--cyan) 45%, var(--magenta) 92%);
        background-size: 220% 220%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 32px rgba(0, 243, 255, 0.18);
        animation:
          text-rise 0.8s 0.2s ease both,
          headline-shimmer 5s 1s ease-in-out infinite;
      }
      .lead {
        max-width: 570px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
        animation: text-rise 0.8s 0.35s ease both;
      }
      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 13px;
        margin-top: 32px;
        animation: text-rise 0.8s 0.5s ease both;
      }
      .secondary {
        min-width: 148px;
        padding: 14px 19px;
        text-decoration: none;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        color: var(--white);
        background: rgba(255, 255, 255, 0.04);
        font:
          600 0.72rem "Orbitron",
          sans-serif;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: 0.25s;
      }
      .secondary:hover {
        border-color: var(--magenta);
        color: var(--magenta);
        box-shadow: 0 0 24px rgba(255, 53, 201, 0.2);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        max-width: 650px;
        margin: 84px auto 0;
        padding: 19px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.04), transparent);
      }
      .stat {
        position: relative;
        padding: 0 25px;
      }
      .stat + .stat::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        height: 30px;
        border-left: 1px solid rgba(255, 255, 255, 0.16);
      }
      .stat strong {
        display: block;
        color: var(--white);
        font:
          700 1.05rem "Orbitron",
          sans-serif;
      }
      .stat span {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 0.66rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .scroll-note {
        margin-top: 35px;
        color: rgba(149, 163, 187, 0.65);
        font:
          0.62rem "Orbitron",
          sans-serif;
        letter-spacing: 0.2em;
        animation:
          text-rise 0.8s 0.65s ease both,
          signal-pulse 3.5s 1.5s ease-in-out infinite;
      }

      @keyframes text-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes headline-shimmer {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      @keyframes signal-pulse {
        0%,
        100% {
          opacity: 0.55;
          text-shadow: 0 0 0 transparent;
        }
        50% {
          opacity: 1;
          text-shadow: 0 0 12px rgba(0, 243, 255, 0.55);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 760px) {
        .shell {
          width: min(100% - 32px, 550px);
        }
        .nav {
          padding: 0 10px;
        }
        .brand {
          gap: 8px;
          font-size: 0.63rem;
          letter-spacing: 0.07em;
        }
        .brand-mark {
          width: 20px;
          height: 20px;
        }
        .brand-mark::after {
          inset: 4px;
        }
        .nav {
          height: 74px;
        }
        .menu {
          display: none;
        }
        .nav-actions {
          gap: 7px;
        }
        .wallet {
          display: none;
        }
        .launch {
          padding: 11px 12px;
          font-size: 0.62rem;
        }
        .hero {
          min-height: calc(100vh - 74px);
          padding: 35px 0 55px;
        }
        h1 {
          width: 100%;
          max-width: 100%;
          margin-top: 23px;
          font-size: clamp(1.2rem, 6.2vw, 2.8rem);
        }
        .lead {
          font-size: 0.89rem;
          line-height: 1.7;
        }
        .hero-actions {
          flex-direction: column;
          align-items: stretch;
          margin: 27px auto 0;
          max-width: 250px;
        }
        .stats {
          margin-top: 64px;
        }
        .stat {
          padding: 0 8px;
        }
        .stat strong {
          font-size: 0.75rem;
        }
        .stat span {
          font-size: 0.52rem;
          letter-spacing: 0.07em;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" id="home">
      <canvas id="space" aria-hidden="true"></canvas>
      <div class="grid-floor" aria-hidden="true"></div>
      <div class="shell">
        <nav class="nav" aria-label="Primary navigation">
          <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>XI RPL // KELOMPOK 08</a>
          <div class="menu"><a href="index.html">Home</a><a href="profil.html">Profil</a><a href="anggota.html">Anggota</a><a href="kontak.html">Kontak</a></div>
        </nav>

        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-content">
            <div class="eyebrow">WELCOME TO XI RPL</div>
            <h1 id="hero-title">Web Profil XI RPL<br />Kelompok 8</h1>
            <p class="lead">Kenali profil kelas, anggota kelompok, dan informasi kontak XI RPL Kelompok 8 dalam satu ruang digital.</p>
            <div class="hero-actions">
              <a class="secondary" href="profil.html">Explore Profile <span aria-hidden="true">+</span></a>
            </div>
            <div class="scroll-note" id="about">THE FUTURE IS ALREADY HERE</div>
          </div>
        </section>
      </div>
    </main>

    <script>
      /*
        SPLINE 3D OPTIONAL REPLACEMENT
        Replace the Three.js canvas with:
        <spline-viewer url="https://prod.spline.design/YOUR-SCENE-ID/scene.splinecode"></spline-viewer>
        Then load the Spline viewer module from unpkg before this script.
        Keep the viewer behind the content with z-index: -2 for readability.
      */
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
      (() => {
        const canvas = document.getElementById("space");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
        camera.position.z = 8;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
        renderer.setSize(innerWidth, innerHeight);

        const group = new THREE.Group();
        scene.add(group);
        const particleCount = 260;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          const radius = 2.2 + Math.random() * 5.7;
          const angle = Math.random() * Math.PI * 2;
          positions[i * 3] = Math.cos(angle) * radius * (1.2 + Math.random() * 0.55);
          positions[i * 3 + 1] = (Math.random() - 0.5) * 6.4;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 5;
        }
        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.025, transparent: true, opacity: 0.72 }));
        group.add(particles);

        const links = [];
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x7928ca, transparent: true, opacity: 0.16 });
        for (let i = 0; i < 32; i++) {
          const geometry = new THREE.BufferGeometry();
          const a = Math.floor(Math.random() * particleCount) * 3;
          const b = Math.floor(Math.random() * particleCount) * 3;
          geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array([...positions.slice(a, a + 3), ...positions.slice(b, b + 3)]), 3));
          const line = new THREE.Line(geometry, lineMaterial);
          group.add(line);
          links.push(line);
        }

        const geometricObjects = [];
        const introDirections = [new THREE.Vector3(-4.5, 1.4, 2.8), new THREE.Vector3(4.6, -2.3, 2.2), new THREE.Vector3(0.8, 4.5, 3.6)];
        const addGeometricObject = (object, speed, drift, phase, index) => {
          const targetPosition = object.position.clone();
          const direction = introDirections[index].clone().multiplyScalar(0.55 + Math.random() * 0.7);
          object.position.copy(targetPosition).add(direction);
          object.scale.setScalar(0.05);
          object.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
          geometricObjects.push({
            object,
            speed,
            drift,
            phase,
            targetPosition,
            startRotation: object.rotation.clone(),
            delay: 0.15 + Math.random() * 0.8,
            duration: 1.05 + Math.random() * 0.65,
          });
          group.add(object);
        };
        const cyanWire = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.22 });
        const magentaWire = new THREE.MeshBasicMaterial({ color: 0xff35c9, wireframe: true, transparent: true, opacity: 0.2 });
        const purpleWire = new THREE.MeshBasicMaterial({ color: 0x7928ca, wireframe: true, transparent: true, opacity: 0.24 });

        const icosahedron = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 1), cyanWire);
        icosahedron.position.set(-4.2, 1.35, -1.2);
        addGeometricObject(icosahedron, 0.28, 0.18, 0.4, 0);

        const octahedron = new THREE.Mesh(new THREE.OctahedronGeometry(0.95, 1), magentaWire);
        octahedron.position.set(4.1, -0.75, -0.8);
        addGeometricObject(octahedron, -0.34, 0.22, 2.1, 1);

        const orbit = new THREE.Group();
        orbit.position.set(3.9, 1.7, -1.6);
        const orbitRing = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.018, 8, 64), purpleWire);
        const orbitRingAccent = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.012, 8, 64), cyanWire);
        orbitRing.rotation.x = Math.PI / 2.8;
        orbitRingAccent.rotation.x = Math.PI / 2.8;
        orbitRingAccent.rotation.y = Math.PI / 3;
        orbit.add(orbitRing, orbitRingAccent);
        addGeometricObject(orbit, 0.22, 0.12, 4.4, 2);

        const mouse = { x: 0, y: 0 };
        addEventListener("pointermove", (event) => {
          mouse.x = (event.clientX / innerWidth - 0.5) * 2;
          mouse.y = (event.clientY / innerHeight - 0.5) * 2;
        });
        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });
        const clock = new THREE.Clock();
        function animate() {
          const time = clock.getElapsedTime();
          group.rotation.y += (mouse.x * 0.12 - group.rotation.y) * 0.018;
          group.rotation.x += (mouse.y * 0.07 - group.rotation.x) * 0.018;
          particles.rotation.y = time * 0.012;
          links.forEach((line, index) => {
            line.rotation.z = Math.sin(time * 0.2 + index) * 0.015;
          });
          geometricObjects.forEach(({ object, speed, drift, phase, targetPosition, startRotation, delay, duration }) => {
            const entranceProgress = Math.min(1, Math.max(0, (time - delay) / duration));
            const easedProgress = 1 - Math.pow(1 - entranceProgress, 3);
            if (entranceProgress < 1) {
              object.position.lerpVectors(object.position, targetPosition, easedProgress * 0.08);
              object.scale.setScalar(0.05 + easedProgress * 0.95);
              object.rotation.x = startRotation.x + easedProgress * 0.8;
              object.rotation.y = startRotation.y + easedProgress * 1.1;
            } else {
              object.position.lerp(targetPosition, 0.02);
              object.scale.setScalar(1);
            }
            object.rotation.x += speed * 0.01;
            object.rotation.y += speed * 0.014;
            object.position.y += Math.sin(time * drift + phase) * 0.0008;
          });
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        }
        animate();
      })();
    </script>
  </body>
</html>
